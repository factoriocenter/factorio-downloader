name: Update Factorio versions

# Checks the official Factorio APIs once a day and updates versions.json when a
# new experimental release appears or an experimental build is promoted to stable.
# Runs scripts/update-versions.php and commits the result straight to main.

on:
  schedule:
    # 08:00 America/Sao_Paulo (BRT, UTC-3) == 11:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json
          coverage: none

      - name: Run tests
        run: php tests/update-versions-test.php

      - name: Update versions.json
        id: update
        run: php scripts/update-versions.php

      - name: Commit and push changes
        if: steps.update.outputs.changed == 'true'
        env:
          DELTA: ${{ steps.update.outputs.delta }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore(versions): ${DELTA}"
          git push
