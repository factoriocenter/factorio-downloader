---
# cPanel Git Version Control deployment.
#
# On "Deploy HEAD Commit", cPanel runs these tasks (as shell commands, from the
# repository clone directory) to copy the app into the live site directory.
# It uses /bin/cp (per cPanel docs; rsync is not guaranteed to exist), never runs
# composer (config.php works without vendor/), and preserves the server's .env,
# vendor/ and certs/ (they are simply not copied).
#
# Change DEPLOYPATH below if your site lives somewhere other than public_html/facdl.
# The copy is skipped automatically if the clone IS the web root (in that case
# "Update from Remote" already updated the files in place).
deployment:
  tasks:
    - export DEPLOYPATH=/home/ggames/public_html/facdl/
    - if [ "$(pwd)/" = "$DEPLOYPATH" ]; then echo "Clone is the web root; git pull already updated the files, nothing to copy."; else /bin/cp -f config.php download.php index.php setup.php strings.php theme.php versions.json .htaccess "$DEPLOYPATH" && /bin/mkdir -p "${DEPLOYPATH}lib" "${DEPLOYPATH}site" && /bin/cp -Rf lib/. "${DEPLOYPATH}lib/" && /bin/cp -Rf site/. "${DEPLOYPATH}site/" && echo "Deployed to $DEPLOYPATH"; fi
